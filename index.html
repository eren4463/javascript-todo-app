<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Görev Yöneticisi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 700px;">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 text-primary fw-bold">
                    <i class="fas fa-check-double me-2"></i>Görev Yöneticisi
                </h2>

                <!-- Ekleme Alanı -->
                <div class="input-group mb-4 shadow-sm rounded">
                    <input type="text" id="taskInput" class="form-control form-control-lg" placeholder="Neler yapmayı planlıyorsun?">
                    <button class="btn btn-primary px-4" id="addBtn">
                        <i class="fas fa-plus"></i> Ekle
                    </button>
                </div>

                <!-- Filtreleme Butonları -->
                <div class="d-flex justify-content-center gap-2 mb-3">
                    <button class="btn btn-outline-secondary active filter-btn" data-filter="all">Tümü</button>
                    <button class="btn btn-outline-secondary filter-btn" data-filter="active">Devam Edenler</button>
                    <button class="btn btn-outline-secondary filter-btn" data-filter="completed">Tamamlananlar</button>
                </div>

                <!-- Listeleme Alanı -->
                <ul class="list-group list-group-flush" id="taskList"></ul>
            </div>
        </div>
    </div>

    <!-- Önce Veritabanı, Sonra Uygulama Yüklenmeli -->
    <script src="./Components/storage.js"></script>
    <script src="./Pages/app.js"></script>
</body>
</html>
